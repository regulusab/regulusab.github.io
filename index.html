<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>命理網站總入口</title>
<meta name="description" content="命理網站總入口：八字論命、一柱論命、十神論命、八字健康、河洛理數、鐵板神數與鐵板取數研究站。">
<meta property="og:title" content="命理網站總入口"><meta property="og:type" content="website">
<meta property="og:description" content="八字、一柱、十神、健康、河洛理數、鐵板神數等命理網站入口。">
<meta property="og:url" content="https://regulusab.github.io/">
<meta name="theme-color" content="#2b2320">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6efe0 radial-gradient(circle at 50% 0,#fbf6ea,#f1e6cc);color:#2b2320;font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;-webkit-text-size-adjust:100%;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{text-align:center;padding:44px 16px 20px}
h1{margin:0;font-size:clamp(26px,6vw,38px);letter-spacing:.2em;font-weight:700}
.sub{margin:10px 0 0;color:#7a6650;letter-spacing:.1em;font-size:15px}
.rule{width:120px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#a8823c,transparent)}
main{max-width:1040px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){main{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){main{grid-template-columns:repeat(3,1fr);gap:18px}}
a.card{display:flex;gap:14px;align-items:center;padding:16px;background:#fffdf7;border:1px solid #e3d3ad;border-radius:12px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(80,50,20,.08);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,50,20,.15);border-color:#a8823c;outline:none}
a.card img{width:60px;height:60px;flex:none;border-radius:50%}
.t{font-size:19px;font-weight:700;letter-spacing:.08em;margin:0 0 4px}
.d{font-size:14px;color:#6b5a48;margin:0;line-height:1.55}
.ext{font-size:11px;color:#a8823c;border:1px solid #d9c391;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:middle;font-weight:normal;letter-spacing:0}
footer{text-align:center;color:#9a8670;font-size:12px;padding:0 16px 30px}
</style></head><body>
<header><h1>命理網站總入口</h1><p class="sub">八字・河洛・鐵板　諸術一覽</p><div class="rule"></div></header>
<main id="grid" aria-live="polite"></main>
<footer>內容僅供參考</footer>
<script>
fetch("sites.json",{cache:"no-cache"}).then(r=>r.json()).then(list=>{
 const g=document.getElementById("grid"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 g.innerHTML=list.map(s=>{const ext=!/^https:\/\/regulusab\.github\.io\//.test(s.url);
  return `<a class="card" href="${esc(s.url)}"${ext?' target="_blank" rel="noopener"':''}><img src="${esc(s.icon)}" alt="" loading="lazy"><div><p class="t">${esc(s.name)}${ext?'<span class="ext">外部</span>':''}</p><p class="d">${esc(s.intro)}</p></div></a>`}).join("");
}).catch(()=>{document.getElementById("grid").textContent="載入網站清單失敗，請重新整理。"});
</script></body></html>
